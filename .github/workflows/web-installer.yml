name: Build and deploy Web Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: xiao_esp32s3_usb
            slug: xiao-esp32s3-usb
            chip: esp32s3
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x0"
          - environment: xiao_esp32s3_ble
            slug: xiao-esp32s3-ble
            chip: esp32s3
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x0"
          - environment: xiao_esp32c3_ble
            slug: xiao-esp32c3-ble
            chip: esp32c3
            flash_size: 4MB
            flash_mode: dio
            boot_offset: "0x0"
          - environment: xiao_esp32c5_ble
            slug: xiao-esp32c5-ble
            chip: esp32c5
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x2000"
          - environment: xiao_esp32c6_ble
            slug: xiao-esp32c6-ble
            chip: esp32c6
            flash_size: 4MB
            flash_mode: dio
            boot_offset: "0x0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately do not cache ~/.platformio.
      # Stale PlatformIO package metadata previously broke the ESP32-C5 tool installation.
      - name: Install PlatformIO
        run: python -m pip install --requirement .github/requirements-build.txt

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Create merged firmware
        run: |
          mkdir -p dist
          firmware="dist/${{ matrix.slug }}.bin"
          esptool="$(find "$HOME/.platformio" -path '*/tool-esptoolpy/esptool.py' -print -quit)"
          boot_app="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$esptool"
          test -n "$boot_app"

          python "$esptool" \
            --chip "${{ matrix.chip }}" merge_bin \
            -o "$firmware" \
            --flash_mode "${{ matrix.flash_mode }}" \
            --flash_freq 80m \
            --flash_size "${{ matrix.flash_size }}" \
            "${{ matrix.boot_offset }}" ".pio/build/${{ matrix.environment }}/bootloader.bin" \
            0x8000 ".pio/build/${{ matrix.environment }}/partitions.bin" \
            0xe000 "$boot_app" \
            0x10000 ".pio/build/${{ matrix.environment }}/firmware.bin"

          python - "$firmware" "${{ matrix.boot_offset }}" <<'PY'
          import sys
          from pathlib import Path
          firmware = Path(sys.argv[1])
          boot_offset = int(sys.argv[2], 0)
          with firmware.open("rb") as stream:
              stream.seek(boot_offset)
              header = stream.read(1)
          if header != b"\xe9":
              raise SystemExit(
                  f"Invalid bootloader header at {boot_offset:#x}: {header.hex() or 'EOF'}"
              )
          print(f"Validated bootloader header at {boot_offset:#x}")
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.slug }}
          path: dist/${{ matrix.slug }}.bin
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Assemble site and manifests
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p site/manifests site/firmware
          cp web/installer.html site/index.html
          cp index.html site/configurator.html
          cp firmware/*.bin site/firmware/

          python - <<'PY'
          import json, os
          from pathlib import Path

          site = Path("site")
          version = os.environ["VERSION"][:7]
          variants = [
              ("xiao-esp32s3-usb", "ChainOSCPad Keyboard - XIAO ESP32-S3 USB", "ESP32-S3"),
              ("xiao-esp32s3-ble", "ChainOSCPad Keyboard - XIAO ESP32-S3 Bluetooth", "ESP32-S3"),
              ("xiao-esp32c3-ble", "ChainOSCPad Keyboard - XIAO ESP32-C3 Bluetooth", "ESP32-C3"),
              ("xiao-esp32c5-ble", "ChainOSCPad Keyboard - XIAO ESP32-C5 Bluetooth", "ESP32-C5"),
              ("xiao-esp32c6-ble", "ChainOSCPad Keyboard - XIAO ESP32-C6 Bluetooth", "ESP32-C6"),
          ]
          for slug, name, chip in variants:
              manifest = {
                  "name": name,
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [{
                      "chipFamily": chip,
                      "parts": [{"path": f"../firmware/{slug}.bin", "offset": 0}]
                  }]
              }
              (site / "manifests" / f"{slug}.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
