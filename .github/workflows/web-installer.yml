name: Build and deploy Web Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: xiao_esp32s3_usb
            slug: xiao-esp32s3-usb
          - environment: xiao_esp32s3_ble
            slug: xiao-esp32s3-ble
          - environment: xiao_esp32c3_ble
            slug: xiao-esp32c3-ble
          - environment: xiao_esp32c5_ble
            slug: xiao-esp32c5-ble
          - environment: xiao_esp32c6_ble
            slug: xiao-esp32c6-ble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Intentionally no ~/.platformio cache:
      # stale package metadata previously broke ESP32-C5 builds.
      - name: Install PlatformIO
        run: python -m pip install --requirement .github/requirements-build.txt

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Collect PlatformIO factory image
        shell: bash
        run: |
          set -euo pipefail
          src=".pio/build/${{ matrix.environment }}/firmware.factory.bin"
          dst="dist/${{ matrix.slug }}.bin"

          if [[ ! -f "$src" ]]; then
            echo "::error::PlatformIO did not generate $src"
            echo "Build directory contents:"
            find ".pio/build/${{ matrix.environment }}" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          mkdir -p dist
          cp "$src" "$dst"

          echo "Using PlatformIO-generated factory image:"
          ls -lh "$src" "$dst"
          sha256sum "$src" "$dst"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.slug }}
          path: dist/${{ matrix.slug }}.bin
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Assemble site and manifests
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p site/manifests site/firmware
          cp web/installer.html site/index.html
          cp index.html site/configurator.html
          cp firmware/*.bin site/firmware/

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("site")
          version = os.environ["VERSION"][:7]

          variants = [
              ("xiao-esp32s3-usb", "ChainOSCPad Keyboard - XIAO ESP32-S3 USB", "ESP32-S3"),
              ("xiao-esp32s3-ble", "ChainOSCPad Keyboard - XIAO ESP32-S3 Bluetooth", "ESP32-S3"),
              ("xiao-esp32c3-ble", "ChainOSCPad Keyboard - XIAO ESP32-C3 Bluetooth", "ESP32-C3"),
              ("xiao-esp32c5-ble", "ChainOSCPad Keyboard - XIAO ESP32-C5 Bluetooth", "ESP32-C5"),
              ("xiao-esp32c6-ble", "ChainOSCPad Keyboard - XIAO ESP32-C6 Bluetooth", "ESP32-C6"),
          ]

          for slug, name, chip in variants:
              firmware = site / "firmware" / f"{slug}.bin"
              if not firmware.is_file():
                  raise SystemExit(f"Missing firmware: {firmware}")

              manifest = {
                  "name": name,
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [
                      {
                          "chipFamily": chip,
                          # firmware.factory.bin is already a complete image
                          # containing bootloader, partition table, boot_app0,
                          # and application at the board-specific offsets.
                          "parts": [
                              {
                                  "path": f"../firmware/{slug}.bin",
                                  "offset": 0
                              }
                          ],
                      }
                  ],
              }

              path = site / "manifests" / f"{slug}.json"
              path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"{path}: {firmware.stat().st_size} bytes")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
