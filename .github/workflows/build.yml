name: Build firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: xiao_esp32s3_usb
            slug: xiao-esp32s3-usb
            chip: esp32s3
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x0"

          - environment: xiao_esp32s3_ble
            slug: xiao-esp32s3-ble
            chip: esp32s3
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x0"

          - environment: xiao_esp32c3_ble
            slug: xiao-esp32c3-ble
            chip: esp32c3
            flash_size: 4MB
            flash_mode: dio
            boot_offset: "0x0"

          - environment: xiao_esp32c5_ble
            slug: xiao-esp32c5-ble
            chip: esp32c5
            flash_size: 8MB
            flash_mode: dio
            boot_offset: "0x2000"

          - environment: xiao_esp32c6_ble
            slug: xiao-esp32c6-ble
            chip: esp32c6
            flash_size: 4MB
            flash_mode: dio
            boot_offset: "0x0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep PlatformIO package caching disabled.
      - name: Install PlatformIO
        run: python -m pip install --requirement .github/requirements-build.txt

      - name: Build firmware
        run: platformio run -e "${{ matrix.environment }}"

      # Create the exact merged image that will be distributed by Web Installer.
      # This follows the proven ChainOSCPad release workflow.
      - name: Create merged firmware
        shell: bash
        run: |
          set -euo pipefail

          firmware="dist/${{ matrix.slug }}.bin"
          esptool="$(find "$HOME/.platformio" -path '*/tool-esptoolpy/esptool.py' -print -quit)"
          boot_app="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"

          test -n "$esptool"
          test -f "$esptool"
          test -n "$boot_app"
          test -f "$boot_app"

          build=".pio/build/${{ matrix.environment }}"
          test -f "$build/bootloader.bin"
          test -f "$build/partitions.bin"
          test -f "$build/firmware.bin"

          mkdir -p dist

          python "$esptool" \
            --chip "${{ matrix.chip }}" merge_bin \
            -o "$firmware" \
            --flash_mode "${{ matrix.flash_mode }}" \
            --flash_freq 80m \
            --flash_size "${{ matrix.flash_size }}" \
            "${{ matrix.boot_offset }}" "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xe000 "$boot_app" \
            0x10000 "$build/firmware.bin"

          python - "$firmware" "${{ matrix.boot_offset }}" <<'PY'
          import sys
          from pathlib import Path

          firmware = Path(sys.argv[1])
          boot_offset = int(sys.argv[2], 0)

          with firmware.open("rb") as stream:
              stream.seek(boot_offset)
              header = stream.read(1)

          if header != b"\xe9":
              raise SystemExit(
                  f"Invalid bootloader header at {boot_offset:#x}: "
                  f"{header.hex() or 'EOF'}"
              )

          print(f"Validated bootloader header at {boot_offset:#x}")
          print(f"Merged image size: {firmware.stat().st_size} bytes")
          PY

          sha256sum "$firmware" | tee "dist/${{ matrix.slug }}.sha256"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.slug }}
          path: |
            dist/${{ matrix.slug }}.bin
            dist/${{ matrix.slug }}.sha256
          if-no-files-found: error
          retention-days: 7

  deploy-web-installer:
    name: Deploy GitHub Pages
    # PRs still build/test all five targets, but must not deploy Pages.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT: no firmware build occurs in this job.
      # These are the exact merged binaries produced by the build jobs above.
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Assemble Web Installer site
        shell: bash
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p site/manifests site/firmware
          cp web/installer.html site/index.html
          cp index.html site/configurator.html
          cp firmware/*.bin site/firmware/

          echo "Firmware SHA-256 values used by Web Installer:"
          cat firmware/*.sha256

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("site")
          version = os.environ["VERSION"][:7]

          variants = [
              ("xiao-esp32s3-usb",
               "ChainOSCPad Keyboard - XIAO ESP32-S3 USB",
               "ESP32-S3"),
              ("xiao-esp32s3-ble",
               "ChainOSCPad Keyboard - XIAO ESP32-S3 Bluetooth",
               "ESP32-S3"),
              ("xiao-esp32c3-ble",
               "ChainOSCPad Keyboard - XIAO ESP32-C3 Bluetooth",
               "ESP32-C3"),
              ("xiao-esp32c5-ble",
               "ChainOSCPad Keyboard - XIAO ESP32-C5 Bluetooth",
               "ESP32-C5"),
              ("xiao-esp32c6-ble",
               "ChainOSCPad Keyboard - XIAO ESP32-C6 Bluetooth",
               "ESP32-C6"),
          ]

          for slug, name, chip in variants:
              binary = site / "firmware" / f"{slug}.bin"
              if not binary.is_file():
                  raise SystemExit(f"Missing firmware: {binary}")

              manifest = {
                  "name": name,
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [{
                      "chipFamily": chip,
                      "parts": [{
                          "path": f"../firmware/{slug}.bin",
                          "offset": 0
                      }]
                  }],
              }

              path = site / "manifests" / f"{slug}.json"
              path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"{slug}: {binary.stat().st_size} bytes")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
