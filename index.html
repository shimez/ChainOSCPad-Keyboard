<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainOSCPad KeyPad Configurator</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9;
  --panel:#fff;
  --line:#d7dce2;
  --line-strong:#aeb6c0;
  --text:#111318;
  --muted:#667085;
  --accent:#2563eb;
  --accent-soft:#eaf1ff;
  --ok:#18a957;
  --danger:#b42318;
  --header:#111827;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,select,input{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
header{
  min-height:76px;
  padding:14px 24px;
  background:var(--header);
  color:#fff;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.title{font-size:23px;font-weight:750;letter-spacing:-.02em}
.connection{display:flex;align-items:center;gap:8px;font-weight:650;color:#e5e7eb}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid #4b5563;
  background:#111827;
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:650;
}
.btn:hover{background:#1f2937}
.btn.light{
  background:#fff;
  color:#1f2937;
  border-color:var(--line-strong);
}
.btn.light:hover{background:#f8fafc}
.btn.danger{color:var(--danger);border-color:#efc3bf;background:#fff}

main{
  flex:1;
  display:grid;
  grid-template-columns:minmax(640px,1.18fr) minmax(420px,.82fr);
  gap:18px;
  padding:18px 24px 12px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.035);
}

/* physical keyboard mockup */
.device-wrap{
  padding:26px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.device{
  width:min(100%,594px);
  height:578px;
  border:2px solid #16181c;
  border-radius:26px;
  background:#fff;
  position:relative;
  padding:34px 42px;
  display:grid;
  grid-template-columns:105px 105px 105px 105px;
  grid-template-rows:105px 105px 105px 105px;
  column-gap:30px;
  row-gap:30px;
  align-items:center;
  justify-content:start;
}
.screw{
  position:absolute;
  width:24px;height:24px;border:2px solid #111;border-radius:50%;
}
.screw:before,.screw:after{
  content:"";position:absolute;background:#111;left:50%;top:50%;transform:translate(-50%,-50%);
}
.screw:before{width:11px;height:2px}
.screw:after{width:2px;height:11px}
.s1{left:16px;top:16px}.s2{right:16px;top:16px}.s3{left:16px;bottom:16px}.s4{right:16px;bottom:16px}

.key{
  width:105px;
  height:105px;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.keycap{
  width:99px;
  height:99px;
  border:5px solid #111;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:500;
  transition:.12s ease;
}
.key:hover .keycap{transform:translateY(-1px)}
.key.selected .keycap{
  border-color:var(--accent);
  box-shadow:0 0 0 5px var(--accent-soft);
}

.encoder-area{
  grid-column:4;
  grid-row:1;
  width:105px;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.encoder-side{
  width:82px;
  text-align:center;
  font-size:24px;
}
.arc{
  font-size:58px;
  line-height:.7;
  display:block;
  margin-bottom:2px;
}
.encoder{
  width:105px;
  height:105px;
  min-width:105px;
  min-height:105px;
  flex:0 0 105px;
  aspect-ratio:1 / 1;
  border:5px solid #111;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  background:#fff;
  cursor:pointer;
}
.encoder.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 5px var(--accent-soft);
}

/* settings */
.settings{display:flex;flex-direction:column;gap:14px}
.section{padding:20px}
.section h2{margin:0 0 18px;font-size:18px}
.field-row{
  display:grid;
  grid-template-columns:165px 1fr;
  gap:14px;
  align-items:center;
  margin-bottom:12px;
}
.field-row:last-child{margin-bottom:0}
.field-row label,.field-title{font-size:14px;font-weight:700;color:#344054}
select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:#fff;
  outline:none;
}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.selected-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px
}
.selected-head h2{margin:0}
.badge{
  background:#eef1f5;color:#344054;border-radius:7px;
  padding:5px 9px;font-size:12px;font-weight:750;
}
.stack{display:grid;gap:12px}
.modifiers{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.mod{
  min-height:52px;
  border:1px solid var(--line);
  border-radius:9px;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  cursor:pointer;
}
.mod input{width:18px;height:18px;accent-color:var(--accent)}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.quick{
  min-height:54px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  cursor:pointer;
  font-weight:650;
}
.quick:hover{background:#f8fafc}
footer{
  position:sticky;
  bottom:0;
  z-index:20;
  margin:0;
  padding:10px 24px 14px;
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  background:linear-gradient(to bottom,rgba(246,247,249,.88),var(--bg) 30%);
  backdrop-filter:blur(6px);
}
.log{padding:12px 14px;min-height:56px}
.log-title{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:5px}
.log-line{display:flex;align-items:center;gap:8px;font-size:13px;color:#344054}
.fw{font-size:13px;color:#475467;white-space:nowrap}
.legal{font-size:11px;color:#667085;white-space:nowrap}
.legal a{color:inherit;text-decoration:none}
.legal a:hover{text-decoration:underline}

@media(max-width:1180px){
  main{grid-template-columns:1fr}
  .device-wrap{min-height:auto}
}
@media(max-width:820px){
  header{padding:12px 14px}
  .actions{margin-left:0;width:100%}
  main{padding:12px}
  footer{
    position:static;
    margin:0;
    padding:0 12px 12px;
    grid-template-columns:1fr;
    background:transparent;
    backdrop-filter:none;
  }
  .device{transform-origin:top left;zoom:.8}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">ChainOSCPad KeyPad Configurator</div>
    <div class="connection"><span class="dot" id="connDot"></span><span id="connText">未接続</span></div>
    <div class="actions">
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn" id="connectBtn">接続</button>
      <button class="btn" id="readBtn">設定を読み込む</button>
      <button class="btn" id="exportBtn">設定をファイルに保存</button>
      <button class="btn" id="importDeviceBtn">設定ファイルをデバイスに反映</button>
      <button class="btn" id="saveDeviceBtn">デバイスに保存</button>
    </div>
  </header>

  <main>
    <section class="panel device-wrap">
      <div class="device">
        <!-- SW1-SW12 are fixed to columns 1-3, rows 1-4. Column 4 is encoder-only. Encoder remains a true circle; CW/CCW labels/arrows are intentionally omitted. -->
        <span class="screw s1"></span><span class="screw s2"></span>
        <span class="screw s3"></span><span class="screw s4"></span>

        <button class="key selected" data-key="0" style="grid-column:1;grid-row:1"><span class="keycap">SW1</span></button>
        <button class="key" data-key="1" style="grid-column:2;grid-row:1"><span class="keycap">SW2</span></button>
        <button class="key" data-key="2" style="grid-column:3;grid-row:1"><span class="keycap">SW3</span></button>

        <div class="encoder-area">
          <button class="encoder" id="encoderPush">Push</button>
        </div>

        <button class="key" data-key="3" style="grid-column:1;grid-row:2"><span class="keycap">SW4</span></button>
        <button class="key" data-key="4" style="grid-column:2;grid-row:2"><span class="keycap">SW5</span></button>
        <button class="key" data-key="5" style="grid-column:3;grid-row:2"><span class="keycap">SW6</span></button>

        <button class="key" data-key="6" style="grid-column:1;grid-row:3"><span class="keycap">SW7</span></button>
        <button class="key" data-key="7" style="grid-column:2;grid-row:3"><span class="keycap">SW8</span></button>
        <button class="key" data-key="8" style="grid-column:3;grid-row:3"><span class="keycap">SW9</span></button>

        <button class="key" data-key="9" style="grid-column:1;grid-row:4"><span class="keycap">SW10</span></button>
        <button class="key" data-key="10" style="grid-column:2;grid-row:4"><span class="keycap">SW11</span></button>
        <button class="key" data-key="11" style="grid-column:3;grid-row:4"><span class="keycap">SW12</span></button>
      </div>
    </section>

    <aside class="settings">
      <section class="panel section" id="encoderSettings" hidden>
        <h2>ロータリーエンコーダーの設定</h2>
        <div class="field-row">
          <label>時計回り (CW)</label>
          <select id="encCw"><option value="VOLUME_UP">Volume Up</option><option value="VOLUME_DOWN">Volume Down</option><option value="PLAY_PAUSE">Play / Pause</option><option value="NONE">None</option></select>
        </div>
        <div class="field-row">
          <label>反時計回り (CCW)</label>
          <select id="encCcw"><option value="VOLUME_DOWN">Volume Down</option><option value="VOLUME_UP">Volume Up</option><option value="PLAY_PAUSE">Play / Pause</option><option value="NONE">None</option></select>
        </div>
        <div class="field-row">
          <label>押し込み (Push)</label>
          <select id="encPushSelect"><option value="MUTE">Mute</option><option value="PLAY_PAUSE">Play / Pause</option><option value="ENTER">Enter</option><option value="NONE">None</option></select>
        </div>
      </section>

      <section class="panel section" id="keySettings">
        <div class="selected-head">
          <h2>選択中のキーの設定</h2>
          <span class="badge" id="selectedBadge">SW1</span>
        </div>

        <div class="stack">
          <div>
            <div class="field-title" style="margin-bottom:7px">キーの割り当て</div>
            <select id="keyAssign"><option value="NONE">NONE</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option><option value="H">H</option><option value="I">I</option><option value="J">J</option><option value="K">K</option><option value="L">L</option><option value="M">M</option><option value="N">N</option><option value="O">O</option><option value="P">P</option><option value="Q">Q</option><option value="R">R</option><option value="S">S</option><option value="T">T</option><option value="U">U</option><option value="V">V</option><option value="W">W</option><option value="X">X</option><option value="Y">Y</option><option value="Z">Z</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="0">0</option><option value="ENTER">ENTER</option><option value="ESC">ESC</option><option value="TAB">TAB</option><option value="SPACE">SPACE</option><option value="BACKSPACE">BACKSPACE</option><option value="UP">UP</option><option value="DOWN">DOWN</option><option value="LEFT">LEFT</option><option value="RIGHT">RIGHT</option><option value="INSERT">INSERT</option><option value="DELETE">DELETE</option><option value="HOME">HOME</option><option value="END">END</option><option value="PAGE_UP">PAGE_UP</option><option value="PAGE_DOWN">PAGE_DOWN</option><option value="F1">F1</option><option value="F2">F2</option><option value="F3">F3</option><option value="F4">F4</option><option value="F5">F5</option><option value="F6">F6</option><option value="F7">F7</option><option value="F8">F8</option><option value="F9">F9</option><option value="F10">F10</option><option value="F11">F11</option><option value="F12">F12</option><option value="F13">F13</option><option value="F14">F14</option><option value="F15">F15</option><option value="F16">F16</option><option value="F17">F17</option><option value="F18">F18</option><option value="F19">F19</option><option value="F20">F20</option><option value="F21">F21</option><option value="F22">F22</option><option value="F23">F23</option><option value="F24">F24</option><option value="VOLUME_UP">VOLUME_UP</option><option value="VOLUME_DOWN">VOLUME_DOWN</option><option value="MUTE">MUTE</option><option value="PLAY_PAUSE">PLAY_PAUSE</option><option value="NEXT_TRACK">NEXT_TRACK</option><option value="PREVIOUS_TRACK">PREVIOUS_TRACK</option><option value="STOP">STOP</option></select>
          </div>

          <div class="field-title">修飾キー（複数選択可）</div>
          <div class="modifiers">
            <label class="mod"><input type="checkbox" id="modCtrl">Ctrl</label>
            <label class="mod"><input type="checkbox" id="modShift">Shift</label>
            <label class="mod"><input type="checkbox" id="modAlt">Alt</label>
            <label class="mod"><input type="checkbox" id="modGui">GUI (Windows)</label>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <footer>
    <section class="panel log">
      <div class="log-title">メッセージログ</div>
      <div class="log-line"><span class="dot" id="logDot"></span><span id="logText">未接続です。</span></div>
    </section>
    <div>
      <div class="fw">ファームウェア: v1.0.0</div>
      <div class="legal">© 2026 Shimez · MIT License · Created with assistance from ChatGPT by OpenAI</div>
    </div>
    <button class="btn light danger" id="factoryResetBtn">設定を初期化（工場出荷状態）</button>
  </footer>
</div>


<script>
const DEFAULT_CONFIG = {
  version: 1,
  keys: ["F13","F14","F15","F16","F17","F18","F19","F20","F21","F22","F23","F24"],
  encoder: { cw:"VOLUME_UP", ccw:"VOLUME_DOWN", push:"MUTE" }
};

const modifierNames = ["CTRL","SHIFT","ALT","GUI"];
const assignments = [...DEFAULT_CONFIG.keys];
const modifiers = Array.from({length:12}, ()=>({ctrl:false,shift:false,alt:false,gui:false}));

const keys = [...document.querySelectorAll(".key")];
const badge = document.getElementById("selectedBadge");
const assign = document.getElementById("keyAssign");
const logText = document.getElementById("logText");
const connText = document.getElementById("connText");
const connDot = document.getElementById("connDot");
const logDot = document.getElementById("logDot");
const connectBtn = document.getElementById("connectBtn");
const readBtn = document.getElementById("readBtn");
const saveDeviceBtn = document.getElementById("saveDeviceBtn");
const exportBtn = document.getElementById("exportBtn");
const importDeviceBtn = document.getElementById("importDeviceBtn");
const importFile = document.getElementById("importFile");
const factoryResetBtn = document.getElementById("factoryResetBtn");
const encCw = document.getElementById("encCw");
const encCcw = document.getElementById("encCcw");
const encPush = document.getElementById("encPushSelect");
const encoderPushGraphic = document.getElementById("encoderPush");
const encoderSettings = document.getElementById("encoderSettings");
const keySettings = document.getElementById("keySettings");

const modInputs = {
  ctrl: document.getElementById("modCtrl"),
  shift: document.getElementById("modShift"),
  alt: document.getElementById("modAlt"),
  gui: document.getElementById("modGui")
};

let selected = 0;
let port = null;
let reader = null;
let writer = null;
let readBuffer = "";
let pending = [];
let readLoopPromise = null;
let disconnecting = false;

function setLog(message, ok=true) {
  logText.textContent = message;
  logDot.style.background = ok ? "var(--ok)" : "#dc2626";
}

function setConnection(connected) {
  connText.textContent = connected ? "接続済み" : "未接続";
  connDot.style.background = connected ? "var(--ok)" : "#9ca3af";
  connectBtn.textContent = connected ? "切断" : "接続";
}

function splitAction(action) {
  const parts = String(action ?? "NONE")
    .split("+")
    .map(v => v.trim().toUpperCase())
    .filter(Boolean);

  const mods = new Set();
  const normal = [];
  for (const p of parts) {
    if (modifierNames.includes(p)) mods.add(p);
    else normal.push(p);
  }
  return {key: normal.join("+") || "NONE", mods};
}

function composeAction(index) {
  const base = assignments[index] || "NONE";
  const mods = [];
  if (modifiers[index].ctrl) mods.push("CTRL");
  if (modifiers[index].shift) mods.push("SHIFT");
  if (modifiers[index].alt) mods.push("ALT");
  if (modifiers[index].gui) mods.push("GUI");

  if (base === "NONE") return mods.length ? mods.join("+") : "NONE";
  return [...mods, base].join("+");
}

function refreshEditor() {
  keys.forEach((k,i)=>k.classList.toggle("selected", i===selected));
  encoderPushGraphic.classList.remove("selected");
  badge.textContent = `SW${selected+1}`;
  assign.disabled = false;
  Object.values(modInputs).forEach(el => el.disabled = false);
  assign.value = assignments[selected];

  for (const [name,input] of Object.entries(modInputs)) {
    input.checked = modifiers[selected][name];
  }
}

function applyConfig(cfg) {
  if (!cfg || !Array.isArray(cfg.keys) || cfg.keys.length !== 12) {
    throw new Error("keys は12要素である必要があります");
  }

  for (let i=0; i<12; i++) {
    const parsed = splitAction(cfg.keys[i]);
    assignments[i] = parsed.key;
    modifiers[i].ctrl = parsed.mods.has("CTRL");
    modifiers[i].shift = parsed.mods.has("SHIFT");
    modifiers[i].alt = parsed.mods.has("ALT");
    modifiers[i].gui = parsed.mods.has("GUI");
  }

  encCw.value = cfg.encoder?.cw ?? "VOLUME_UP";
  encCcw.value = cfg.encoder?.ccw ?? "VOLUME_DOWN";
  encPush.value = cfg.encoder?.push ?? "MUTE";
  refreshEditor();
}

function collectConfig() {
  return {
    version: 1,
    keys: Array.from({length:12}, (_,i)=>composeAction(i)),
    encoder: {
      cw: encCw.value,
      ccw: encCcw.value,
      push: encPush.value
    }
  };
}

async function sendCommand(obj) {
  if (!writer) throw new Error("デバイスに接続されていません");

  const payload = JSON.stringify(obj) + "\n";
  await writer.write(new TextEncoder().encode(payload));

  return new Promise((resolve,reject)=>{
    const entry = {resolve,reject,timer:null};
    entry.timer = setTimeout(()=>{
      const idx = pending.indexOf(entry);
      if (idx >= 0) pending.splice(idx,1);
      reject(new Error("デバイスから応答がありません"));
    },3000);
    pending.push(entry);
  });
}

function dispatchLine(line) {
  if (!line.trim()) return;

  let msg;
  try {
    msg = JSON.parse(line);
  } catch {
    console.warn("Invalid JSON:", line);
    return;
  }

  const p = pending.shift();
  if (!p) return;

  clearTimeout(p.timer);
  if (msg.ok) p.resolve(msg);
  else p.reject(new Error(msg.error || "デバイスエラー"));
}

async function readLoop() {
  try {
    while (port?.readable) {
      reader = port.readable.getReader();

      try {
        while (true) {
          const {value,done} = await reader.read();
          if (done) break;

          readBuffer += new TextDecoder().decode(value,{stream:true});

          while (true) {
            const idx = readBuffer.indexOf("\n");
            if (idx < 0) break;

            const line = readBuffer.slice(0,idx).replace(/\r$/ ,"");
            readBuffer = readBuffer.slice(idx+1);
            dispatchLine(line);
          }
        }
      } finally {
        reader.releaseLock();
        reader = null;
      }

      if (disconnecting) break;
    }
  } catch (e) {
    console.error(e);
    if (!disconnecting) {
      setLog("接続が切断されました。", false);
    }
  }
}

async function connect() {
  if (!("serial" in navigator)) {
    throw new Error("WebSerial非対応です。Edge / Chromeを使用してください。");
  }

  disconnecting = false;

  try {
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer = port.writable.getWriter();
    readLoopPromise = readLoop();
    setConnection(true);

    const res = await sendCommand({cmd:"get"});
    applyConfig(res.config);
    setLog("デバイスから設定を取得しました。");
  } catch (e) {
    const message =
      e?.name === "NotFoundError"
        ? "シリアルポートが選択されませんでした。"
        : `シリアル接続に失敗しました: ${e?.message || "不明なエラー"}`;

    if (port || reader || writer) {
      try { await disconnect(); } catch {}
    } else {
      setConnection(false);
    }

    throw new Error(message);
  }
}

async function disconnect() {
  if (disconnecting) return;
  disconnecting = true;

  try {
    for (const p of pending.splice(0)) {
      clearTimeout(p.timer);
      p.reject(new Error("切断されました"));
    }

    if (reader) {
      try { await reader.cancel(); } catch {}
    }

    if (readLoopPromise) {
      try { await readLoopPromise; } catch {}
      readLoopPromise = null;
    }

    if (writer) {
      try { writer.releaseLock(); } catch {}
      writer = null;
    }

    if (port) {
      try { await port.close(); } catch {}
      port = null;
    }

    readBuffer = "";
    setConnection(false);
    setLog("デバイスから切断しました。");
  } finally {
    disconnecting = false;
  }
}

keys.forEach((key,i)=>{
  key.addEventListener("click",()=>{
    selected = i;
    encoderSettings.hidden = true;
    keySettings.hidden = false;
    refreshEditor();
    setLog(`SW${i+1} を選択しました。`);
  });
});

assign.addEventListener("change",()=>{
  assignments[selected] = assign.value;
  setLog(`SW${selected+1}: ${composeAction(selected)}`);
});

for (const [name,input] of Object.entries(modInputs)) {
  input.addEventListener("change",()=>{
    modifiers[selected][name] = input.checked;
    setLog(`SW${selected+1}: ${composeAction(selected)}`);
  });
}

encoderPushGraphic.addEventListener("click",()=>{
  keys.forEach(k=>k.classList.remove("selected"));
  encoderPushGraphic.classList.add("selected");
  keySettings.hidden = true;
  encoderSettings.hidden = false;
  setLog("ロータリーエンコーダーを選択しました。");
});

connectBtn.addEventListener("click", async ()=>{
  try {
    if (port) await disconnect();
    else await connect();
  } catch(e) {
    setLog(e.message, false);
  }
});

readBtn.addEventListener("click", async ()=>{
  try {
    const res = await sendCommand({cmd:"get"});
    applyConfig(res.config);
    setLog("デバイスから設定を読み込みました。");
  } catch(e) {
    setLog("読込エラー: " + e.message, false);
  }
});

saveDeviceBtn.addEventListener("click", async ()=>{
  try {
    const res = await sendCommand({cmd:"set", config:collectConfig()});
    applyConfig(res.config);
    setLog("デバイス上の設定を更新し、LittleFSへ保存しました。");
  } catch(e) {
    setLog("保存エラー: " + e.message, false);
  }
});

exportBtn.addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(collectConfig(),null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "chainoscpad-keymap.json";
  a.click();
  URL.revokeObjectURL(url);
  setLog("設定JSONを保存しました。");
});

importDeviceBtn.addEventListener("click", ()=>{
  if (!writer) {
    setLog("設定ファイルを反映するには、先にデバイスへ接続してください。", false);
    return;
  }
  // Allow selecting the same file again after a previous import.
  importFile.value = "";
  importFile.click();
});

importFile.addEventListener("change", async ()=>{
  const file = importFile.files?.[0];
  if (!file) return;

  try {
    if (!writer) throw new Error("デバイスに接続されていません");

    const cfg = JSON.parse(await file.text());

    // Validate/render the imported configuration before sending it.
    applyConfig(cfg);

    const res = await sendCommand({cmd:"set", config:collectConfig()});
    applyConfig(res.config);
    setLog(`設定ファイル「${file.name}」をデバイスに反映し、LittleFSへ保存しました。`);
  } catch(e) {
    setLog("設定ファイル反映エラー: " + (e?.message || "不明なエラー"), false);
  } finally {
    importFile.value = "";
  }
});

async function resetDevice() {
  if (!port) {
    applyConfig(DEFAULT_CONFIG);
    setLog("画面上の設定を初期値に戻しました。");
    return;
  }

  const res = await sendCommand({cmd:"reset"});
  applyConfig(res.config);
  setLog("デバイス上の設定を工場出荷状態へ更新しました。");
}


factoryResetBtn.addEventListener("click", async ()=>{
  if (!confirm("設定を工場出荷状態へ戻しますか？")) return;

  try {
    await resetDevice();
  } catch(e) {
    setLog("初期化エラー: " + e.message, false);
  }
});

navigator.serial?.addEventListener("disconnect", async ()=>{
  if (port) await disconnect();
});

applyConfig(DEFAULT_CONFIG);
setConnection(false);
</script>

</body>
</html>
