[platformio]
default_envs = xiao_esp32c3_ble

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0

[env:xiao_esp32s3_usb]
board = seeed_xiao_esp32s3
build_flags =
    -D CHAINOSCPAD_TARGET_ESP32S3_USB
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:xiao_esp32s3_ble]
board = seeed_xiao_esp32s3
build_flags =
    -D CHAINOSCPAD_TARGET_ESP32S3_BLE
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ 2.5.1

[env:xiao_esp32c3_ble]
board = seeed_xiao_esp32c3
build_flags =
    -D CHAINOSCPAD_TARGET_ESP32C3_BLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ 2.5.1

[env:xiao_esp32c6_ble]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -D CHAINOSCPAD_TARGET_ESP32C6_BLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0
    h2zero/NimBLE-Arduino @ 2.5.1

[env:xiao_esp32c5_ble]
platform = https://github.com/Seeed-Studio/platform-seeedboards/archive/85c1da71176e03af4b87561032274a81449a873c.zip
board = seeed-xiao-esp32-c5
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

extra_scripts = pre:scripts/platformio_seeed_esp.py

platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
    framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7-libs.tar.xz
    toolchain-riscv32-esp@https://github.com/pioarduino/registry/releases/download/0.0.1/riscv32-esp-elf-14.2.0_20251107.zip
    tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.2.zip

build_flags =
    -D CHAINOSCPAD_TARGET_ESP32C5_BLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0
    h2zero/NimBLE-Arduino @ 2.5.1
